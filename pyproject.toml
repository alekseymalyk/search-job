[project]
name = "job-scraper"
version = "0.1.0"
description = "Automated job scraper pipeline: scrape LinkedIn/Indeed → filter → rank → export CSV"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "python-jobspy>=1.1",
]

[project.scripts]
job-scraper = "job_scraper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_scraper"]
